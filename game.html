<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pixel Lab: Geometric Trail Pro</title>
    <style>
        body { margin: 0; background: #050505; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; }
        #controls { width: 300px; background: #1a1a1a; padding: 20px; border-right: 2px solid #333; height: 100vh; overflow-y: auto; }
        canvas { flex-grow: 1; cursor: crosshair; image-rendering: pixelated; }
        .panel { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        select, input[type="range"], input[type="color"] { width: 100%; margin-bottom: 15px; background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; box-sizing: border-box; }
        input[type="color"] { height: 40px; cursor: pointer; border: none; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 12px; }
        .checkbox-group input { width: auto; margin: 0; }
        button { width: 100%; padding: 12px; background: #b33; border: none; color: white; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        button:hover { background: #d44; }
    </style>
</head>
<body>

<div id="controls">
    <div class="panel">
        <label>Цвет частиц</label>
        <input type="color" id="particleColor" value="#ff0055">
        <div class="checkbox-group">
            <input type="checkbox" id="rainbowMode">
            <label for="rainbowMode" style="margin: 0; color: #fff;">Радужный режим</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="trailEnabled" checked>
            <label for="trailEnabled" style="margin: 0; color: #fff;">Включить шлейф</label>
        </div>
    </div>

    <div class="panel">
        <label>Форма частицы</label>
        <select id="pShape">
            <option value="square">Квадрат</option>
            <option value="plus">Плюс (+)</option>
            <option value="cross">Крест (X)</option>
        </select>
        <label>Узор</label>
        <select id="sPattern">
            <option value="plus">Плюс (+)</option>
            <option value="circle">Круг</option>
            <option value="star">Звезда</option>
            <option value="square_fill">Квадрат</option>
        </select>
    </div>

    <div class="panel">
        <label>Размер частицы</label>
        <input type="range" id="pSize" min="2" max="20" value="6">
        <label>Масштаб узора</label>
        <input type="range" id="spawnScale" min="0.5" max="4" step="0.5" value="1">
        <label>Интенсивность шлейфа</label>
        <input type="range" id="trailAlpha" min="0.05" max="0.5" step="0.05" value="0.2">
        <label>Частота спавна</label>
        <input type="range" id="spawnDelay" min="1" max="10" value="2">
        <label>Жизнь частицы</label>
        <input type="range" id="lifeSpan" min="0.005" max="0.05" step="0.005" value="0.015">
        <label>Сила разлета</label>
        <input type="range" id="speed" min="0" max="3" step="0.1" value="0.5">
    </div>

    <button id="clearBtn">Очистить холст</button>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const GRID = 10;
    
    let particles = [];
    let isDrawing = false;
    let frameCount = 0;

    const config = { 
        pShape: 'square', sPattern: 'plus', speed: 0.5, 
        spawnDelay: 2, lifeSpan: 0.015,
        trailAlpha: 0.2, color: '#ff0055', isRainbow: false,
        isTrailEnabled: true, pSize: 6, spawnScale: 1
    };

    const patterns = {
        plus: [{x:1,y:0}, {x:2,y:0}, {x:-1,y:0}, {x:-2,y:0}, {x:0,y:1}, {x:0,y:2}, {x:0,y:-1}, {x:0,y:-2}],
        circle: [{x:0,y:-3}, {x:1,y:-3}, {x:-1,y:-3}, {x:2,y:-2}, {x:-2,y:-2}, {x:3,y:-1}, {x:-3,y:-1}, {x:3,y:0}, {x:-3,y:0}, {x:3,y:1}, {x:-3,y:1}, {x:2,y:2}, {x:-2,y:2}, {x:0,y:3}, {x:1,y:3}, {x:-1,y:3}],
        star: [{x:0,y:-2}, {x:0,y:2}, {x:-2,y:0}, {x:2,y:0}, {x:1,y:1}, {x:-1,y:1}, {x:1,y:-1}, {x:-1,y:-1}],
        square_fill: [{x:-1,y:-1}, {x:0,y:-1}, {x:1,y:-1}, {x:-1,y:0}, {x:1,y:0}, {x:-1,y:1}, {x:0,y:1}, {x:1,y:1}]
    };

    class Particle {
        constructor(x, y, shape, vx, vy) {
            this.x = x;
            this.y = y;
            this.shape = shape;
            this.vx = vx;
            this.vy = vy;
            this.life = 1.0;
            this.createdAt = Date.now();
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= config.lifeSpan; 
        }

        draw() {
            if (config.isRainbow) {
                const hue = (this.createdAt / 10 + (this.x + this.y) / 5) % 360;
                ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
            } else {
                ctx.fillStyle = config.color;
            }

            ctx.globalAlpha = this.life;
            const s = config.pSize; 
            const gap = s; 
            
            if (this.shape === 'square') {
                ctx.fillRect(this.x, this.y, s, s);
            } else if (this.shape === 'plus') {
                ctx.fillRect(this.x, this.y, s, s);
                ctx.fillRect(this.x-gap, this.y, s, s); ctx.fillRect(this.x+gap, this.y, s, s);
                ctx.fillRect(this.x, this.y-gap, s, s); ctx.fillRect(this.x, this.y+gap, s, s);
            } else if (this.shape === 'cross') {
                ctx.fillRect(this.x-gap, this.y-gap, s, s); ctx.fillRect(this.x+gap, this.y+gap, s, s);
                ctx.fillRect(this.x+gap, this.y-gap, s, s); ctx.fillRect(this.x-gap, this.y+gap, s, s);
            }
            ctx.globalAlpha = 1.0;
        }
    }

    function animate() {
        const alpha = config.isTrailEnabled ? config.trailAlpha : 1;
        ctx.fillStyle = `rgba(5,5,5,${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        frameCount++;

        if (isDrawing && frameCount % config.spawnDelay === 0) {
            const offsets = patterns[config.sPattern];
            
            offsets.forEach(off => {
                // Строгие координаты без рандома
                const posX = mouse.x + (off.x * config.spawnScale * GRID);
                const posY = mouse.y + (off.y * config.spawnScale * GRID);
                
                // Строгий вектор движения
                const vx = off.x * config.speed;
                const vy = off.y * config.speed;

                particles.push(new Particle(posX, posY, config.pShape, vx, vy));
            });
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }

    let mouse = { x: 0, y: 0 };
    window.onresize = () => { canvas.width = window.innerWidth - 300; canvas.height = window.innerHeight; };
    window.onresize();
    
    canvas.onmousedown = () => isDrawing = true;
    window.onmouseup = () => isDrawing = false;
    canvas.onmousemove = (e) => { mouse.x = e.clientX - 300; mouse.y = e.clientY; };

    document.getElementById('particleColor').oninput = (e) => config.color = e.target.value;
    document.getElementById('rainbowMode').onchange = (e) => config.isRainbow = e.target.checked;
    document.getElementById('trailEnabled').onchange = (e) => config.isTrailEnabled = e.target.checked;
    
    const inputs = ['pShape', 'sPattern', 'spawnDelay', 'lifeSpan', 'speed', 'trailAlpha', 'pSize', 'spawnScale'];
    inputs.forEach(id => {
        document.getElementById(id).oninput = (e) => {
            const val = e.target.value;
            config[id] = isNaN(val) ? val : parseFloat(val);
        };
    });

    document.getElementById('clearBtn').onclick = () => particles = [];
    animate();
</script>
</body>
</html>
