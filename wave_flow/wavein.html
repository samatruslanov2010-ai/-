<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Wave Flow — Главное меню</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow-x: hidden;
        }

        .dev-background {
            position: fixed;
            inset: 0;
            background-image: url('../special_page/img/waveflow.og.png');
            /* поменяй путь на свою картинку */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(18px) brightness(0.55) saturate(1.05);
            transform: scale(1.08);
            z-index: 1;
        }

        .dev-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            text-align: center;
            color: #f8fafc;
            padding: 20px 24px;
            box-sizing: border-box;
            background: linear-gradient(to bottom,
                    rgba(15, 23, 42, 0.15),
                    rgba(15, 23, 42, 0.55));
        }

        .dev-icon {
            width: clamp(40px, 8vw, 56px);
            height: clamp(40px, 8vw, 56px);
            margin-bottom: clamp(16px, 4vw, 24px);
            color: #38bdf8;
            opacity: 0.95;
        }

        .dev-title {
            font-size: clamp(1.75rem, 6vw, 3.5rem);
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .dev-desc {
            font-size: clamp(0.95rem, 3vw, 1.125rem);
            color: #cbd5e1;
            max-width: 560px;
            line-height: 1.6;
            margin: 0 0 clamp(24px, 6vw, 40px) 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn-play,
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: clamp(12px, 3vw, 14px) clamp(20px, 5vw, 28px);
            text-decoration: none;
            border-radius: 8px;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-play {
            background: #2563eb;
            border: 1px solid rgba(37, 99, 235, 0.7);
            color: #fff;
        }

        .btn-play:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }

        .btn-play:active,
        .btn-back:active {
            transform: translateY(0);
        }

        @media (max-width: 560px) {
            .actions {
                width: 100%;
            }

            .btn-play,
            .btn-back {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="dev-background"></div>

    <main class="dev-content">
        <svg class="dev-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h16"></path>
            <path d="M12 4v16"></path>
            <path d="M7 7l10 10"></path>
            <path d="M17 7L7 17"></path>
        </svg>

        <h1 class="dev-title">Wave Flow</h1>

        <p class="dev-desc">
            Wave Flow — интерактивный визуальный проект, позволяющий изменять параметры волн и создавать уникальные
            динамические композиции. Плавная анимация и атмосферные эффекты делают процесс взаимодействия спокойным и
            приятным для восприятия.
        </p>

        <div class="actions">
            <a href="wave.html" class="btn-play">
                Играть
            </a>

            <a href="../index.html" class="btn-back">
                Вернуться к проектам
            </a>
        </div>
    </main>
</body>

</html>
